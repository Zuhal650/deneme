<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Venüs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #0b0c1f;
      color: #fff;
      margin: 0;
      padding: 50px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 30px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { color: #fff; }
      50% { color: gold; }
      100% { color: #fff; }
    }

    img {
      border-radius: 50%;
      box-shadow: 0 0 50px gold;
      width: 300px;
      margin-bottom: 20px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      color: #0b0c1f;
      cursor: pointer;
      transition: transform 0.2s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    button:first-of-type {
      background-color: orange; 
    }

  
    button:last-of-type {
      background-color: green; 
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <h1>Venüs/Venus</h1>
  <img src="venus.jpg" alt="VENÜS">

  <!-- Sesler -->
  <audio id="planetAudio">
    <source src="venus.mp3" type="audio/mpeg">
  </audio>

  <audio id="planetAudioEn">
    <source src="venuss.mp3" type="audio/mpeg">
  </audio>

  <button onclick="playAudio('planetAudio')">
    Tekrar Çal ▶️
  </button>

  <button onclick="playAudio('planetAudioEn')">
    Replay ▶️
  </button>

  <script>
    const audio1 = document.getElementById("planetAudio");
    const audio2 = document.getElementById("planetAudioEn");

    function playAudio(selected) {
      // önce hepsini durdur
      audio1.pause();
      audio1.currentTime = 0;

      audio2.pause();
      audio2.currentTime = 0;

      // sonra seçileni çal
      document.getElementById(selected).play();
    }
  </script>

</body>
</html>
