<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Merkur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #0b0c1f; /* Uzay teması */
      color: #fff;
      margin: 0;
      padding: 50px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 30px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { color: #fff; }
      50% { color: gold; }
      100% { color: #fff; }
    }

    img {
      border-radius: 50%;
      box-shadow: 0 0 50px gold;
      width: 300px;
      margin-bottom: 20px;
    }

    audio {
      margin-top: 20px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      background-color: gold;
      color: #0b0c1f;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>Merkur</h1>
  <img src="merkur.jpg" alt="MERKÜR">
  
  <audio id="planetAudio" autoplay>
    <source src="merkur.mp3" type="audio/mpeg">
   
  </audio>

  <br>
  <button onclick="document.getElementById('planetAudio').play()">Tekrar Çal ▶️</button>
</body>
</html>
